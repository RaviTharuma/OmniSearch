name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Forbid CLAUDE.md (use AGENTS.md)
        run: |
          set -euo pipefail
          hits="$(find . -type f \( -iname 'CLAUDE.md' -o -path '*/.claude/*' \) -not -path './.git/*' -print || true)"
          if [ -n "$hits" ]; then
            echo "Vendor-specific Claude agent files are forbidden. Use AGENTS.md only:"
            printf '%s\n' "$hits"
            exit 1
          fi
          test -f AGENTS.md
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --all
      - name: Build stdio server
        run: cargo build --locked
      - name: Exercise MCP stdio protocol
        run: python3 tests/protocol_smoke.py
